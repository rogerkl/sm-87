# SM-87: an MMT-8 style sequencer, an S700/X7000 style sampler and an HR-16 style drum machine for the M-VAVE FM-1 (fm1-base's tools/build.py)
name = "SM87"
id_prefix = "FM-1_87"          # package identity: dev FM-1_8700, releases FM-1_87XXYYZZ
usb_manufacturer = "SM-87"
usb_product = "SM-87 FM-1"
o2 = ["s700/*.c", "mmt8/*.c", "hr16/*.c", "fx/*.c"]   # the sampler, its memory, the sequencer, the drums, the
                                                     # effect (config.h SM87_FX): -O2
gen = ["../tools/mkkit.py --quiet --out {gen}/hr_kit.h"]   # the drum kit (resources/kit), built in
words = "words.tsv"
ble = false                    # no radio: the RAM goes to sequences and samples
emu = ["midi", "port", "data"] # the browser emulator (--web): Web MIDI with SysEx both ways, a port for other pages
                               # of the site (Axs7), the flash's data area kept in the browser
# the site and firmware.json (fm1-base docs/FIRMWARE-JSON.md: a release build needs them all)
author = "Roger Klaveness"
licence = "MPL-2.0"
tagline = "A 1987 studio: an MMT-8 style sequencer, an S700/X7000 style sampler and an HR-16 style drum machine"
description = "SM-87 turns the M-VAVE FM-1 into a 1987 studio. An Alesis MMT-8 style sequencer records and plays 100 parts and songs. An Akai S700/X7000 style sampler plays with its filter, release and vibrato as measured on an X7000. An Alesis HR-16 style drum machine has 16 pads and 100 patterns. Samples come over USB from Axs7 as to an X7000, and Axs7 can also build samples and a drum kit into the firmware. The MMT-8's and the HR-16's memory dumps go both ways."
tags = ["sequencer", "sampler", "drum-machine", "midi"]
install = "https://rogerkl.github.io/sm-87/install/"
site = "https://rogerkl.github.io/sm-87/"
repo = "https://github.com/rogerkl/sm-87"
screenshot = "app/docs/img/screen.png"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments); the sampler follows Axs7's engine; the effect runs the Alesis MIDIVerb's programs as Eric Brombaugh compiled them (MIDIVerb_RE, g081_audio)."
